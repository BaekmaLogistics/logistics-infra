networks:
  logistics-network:
    external: true

services:
  logistics-discovery-server:
    image: ${DOCKERHUB_USERNAME}/logistics-discovery-server:latest
    restart: unless-stopped
    container_name: logistics-discovery-server
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - logistics-network