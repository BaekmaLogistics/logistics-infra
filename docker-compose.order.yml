networks:
  logistics-network:
    external: true

volumes:
  order_db_data:

services:
  logistics-order-db:
    image: postgres:15-alpine
    container_name: logistics-order-db
    restart: unless-stopped
    volumes:
      - order_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d order_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logistics-network

  logistics-order-service:
    image: ${DOCKERHUB_USERNAME}/logistics-order-service:latest
    container_name: logistics-order-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      DB_HOST: logistics-order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: logistics-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      REDIS_HOST: logistics-redis
      REDIS_PORT: 6379
      EUREKA_SERVER_URL: http://logistics-discovery-server:8761/eureka/
      ZIPKIN_SERVER_URL: http://logistics-zipkin-server:9411/api/v2/spans
      CONFIG_SERVER_URL: http://logistics-config-server:18081
    depends_on:
      logistics-order-db:
        condition: service_healthy
      logistics-config-server:
        condition: service_healthy
      logistics-discovery-server:
        condition: service_healthy
    networks:
      - logistics-network