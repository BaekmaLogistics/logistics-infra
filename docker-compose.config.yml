networks:
  logistics-network:
    external: true

services:
  logistics-config-server:
    image: ${DOCKERHUB_USERNAME}/logistics-config-server:latest
    restart: unless-stopped
    container_name: logistics-config-server
    environment:
      CONFIG_REPOSITORY_URL: https://github.com/BaekmaLogistics/logistics-config-repo
      EUREKA_SERVER_URL: http://logistics-discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:18081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      logistics-discovery-server:
        condition: service_healthy
    networks:
      - logistics-network